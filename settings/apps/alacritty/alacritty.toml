# Alacritty Configuration File
# Part og GPP

[general]
import = [
  "theme.toml",
]

[window]
# opacity = 0.5
blur = true
option_as_alt = "both"
padding = { x = 6, y = 0 }

[colors]
draw_bold_text_with_bright_colors = true

[font]
size = 14.0

[font.normal]
family = "Cica"
style = "Regular"

[font.italic]
family = "Cica"
style = "Italic"

[font.bold]
family = "Cica"
style = "Bold"

[font.bold_italic]
family = "Cica"
style = "Bold Italic"
